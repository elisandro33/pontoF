<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Fácil - Controle de Horas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f4f6f9;
      color: #333;
    }
    h1, h2 { color: #1a73e8; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #1557b0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th { background-color: #1a73e8; color: white; }
    .status-msg {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Ponto Fácil</h1>

  <!-- Formulário de Registro -->
  <div class="card">
    <h2>Registrar / Editar Ponto</h2>
    <form id="formPonto">
      <input type="hidden" id="id" />

      <div class="form-grid">
        <div class="form-group">
          <label for="data">Data</label>
          <input type="text" id="data" placeholder="DD/MM/AAAA" required />
        </div>
        <div class="form-group">
          <label for="entrada">Entrada</label>
          <input type="text" id="entrada" placeholder="07:30" />
        </div>
        <div class="form-group">
          <label for="saida_intervalo">Saída Intervalo</label>
          <input type="text" id="saida_intervalo" placeholder="12:00" />
        </div>
        <div class="form-group">
          <label for="volta_intervalo">Volta Intervalo</label>
          <input type="text" id="volta_intervalo" placeholder="13:00" />
        </div>
        <div class="form-group">
          <label for="saida_final">Saída Final</label>
          <input type="text" id="saida_final" placeholder="18:10" />
        </div>
        <div class="form-group">
          <label for="hora_extra">Hora Extra</label>
          <input type="text" id="hora_extra" placeholder="01:40" />
        </div>
        <div class="form-group">
          <label for="percentual">Percentual (%)</label>
          <input type="text" id="percentual" value="50.0" />
        </div>
      </div>

      <button type="button" onclick="salvarPonto()">Salvar Registro</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>

  <!-- Tabela de Registros da Planilha -->
  <div class="card">
    <h2>Registros Salvos</h2>
    <button onclick="carregarPontos()">Atualizar Lista</button>
    
    <table id="tabelaPontos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Data</th>
          <th>Entrada</th>
          <th>S. Intervalo</th>
          <th>V. Intervalo</th>
          <th>S. Final</th>
          <th>H. Extra</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="8">Clique em "Atualizar Lista" para carregar os dados.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // URL Web App do seu Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbx4EIgcMd7bTnGA_Nn8dcLA3H7BxzCMx1qm9sgB1c1Slad2C1FQTxVZDwGkMr4OTuBt/exec';

    // 1. Função para ENVIAR ou ATUALIZAR dados na planilha (POST)
    async function salvarPonto() {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = 'blue';
      statusDiv.innerText = 'Enviando dados...';

      const dataInput = document.getElementById('data').value.trim();
      if (!dataInput) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Por favor, informe a Data.';
        return;
      }

      const payload = {
        action: 'upsert',
        data: {
          id: document.getElementById('id').value || 'ID_' + Date.now(),
          data: dataInput,
          entrada: document.getElementById('entrada').value.trim(),
          saida_intervalo: document.getElementById('saida_intervalo').value.trim(),
          volta_intervalo: document.getElementById('volta_intervalo').value.trim(),
          saida_final: document.getElementById('saida_final').value.trim(),
          hora_extra: document.getElementById('hora_extra').value.trim(),
          percentual: document.getElementById('percentual').value.trim() || '50.0'
        }
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        if (res.status === 'success') {
          statusDiv.style.color = 'green';
          statusDiv.innerText = 'Registro salvo com sucesso!';
          limparFormulario();
          carregarPontos(); // Recarrega a tabela automaticamente
        } else {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'Erro ao salvar: ' + (res.message || 'Falha no script');
        }
      } catch (err) {
        console.error('Erro de conexão:', err);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Erro de comunicação com a API.';
      }
    }

    // 2. Função para BUSCAR e carregar os pontos salvos na tabela (GET)
    async function carregarPontos() {
      const tbody = document.querySelector('#tabelaPontos tbody');
      tbody.innerHTML = '<tr><td colspan="8">Carregando dados...</td></tr>';

      try {
        const response = await fetch(API_URL);
        const registros = await response.json();

        tbody.innerHTML = ''; // Limpa tabela

        if (registros.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8">Nenhum registro encontrado.</td></tr>';
          return;
        }

        // Preenche a tabela com as linhas vindas do Apps Script
        registros.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.id || '-'}</td>
            <td>${item.data || '-'}</td>
            <td>${item.entrada || '-'}</td>
            <td>${item.saida_intervalo || '-'}</td>
            <td>${item.volta_intervalo || '-'}</td>
            <td>${item.saida_final || '-'}</td>
            <td>${item.hora_extra || '-'}</td>
            <td>${item.percentual || '-'}</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        console.error('Erro ao ler planilha:', err);
        tbody.innerHTML = '<tr><td colspan="8" style="color:red;">Erro ao carregar dados da planilha.</td></tr>';
      }
    }

    function limparFormulario() {
      document.getElementById('id').value = '';
      document.getElementById('data').value = '';
      document.getElementById('entrada').value = '';
      document.getElementById('saida_intervalo').value = '';
      document.getElementById('volta_intervalo').value = '';
      document.getElementById('saida_final').value = '';
      document.getElementById('hora_extra').value = '';
      document.getElementById('percentual').value = '50.0';
    }
  </script>
</body>
</html>
